[build]
  command = "npm run build"
  publish = ".next"
  # Deploy-Credits sparen: ein Netlify-Production-Deploy kostet 15 Credits,
  # unabhaengig von der Buildzeit. Commits, die NUR CI-Workflows, Docs, Markdown
  # oder Tests aendern, loesen deshalb keinen Build aus.
  # Exit 0 = Build ueberspringen, Exit != 0 = bauen. Beim ersten Build ist
  # CACHED_COMMIT_REF leer, git diff schlaegt fehl und es wird gebaut.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude).github' ':(exclude)docs' ':(exclude)**/*.md' ':(exclude)tests'"

[build.environment]
  NEXT_PRIVATE_STANDALONE = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect www to non-www (canonical domain)
[[redirects]]
  from = "https://www.steuerboard.pro/*"
  to = "https://steuerboard.pro/:splat"
  status = 301
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
